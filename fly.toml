# Proofline on Fly.io: ONE app, ONE Machine, three processes over loopback.

# Deliberately NOT using [processes]: that runs each group on a separate Machine, which would break the loopback topology and split the SQLite volume off from the service that writes it. supervisord inside the image is Fly's documented way to run several processes on one Machine. Set `app` to your own name before deploying; `primary_region` to a region near the judges.

app = "proofline"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

# Only the gateway is routed. The analysis service (127.0.0.1:8099) and the reference agent (127.0.0.1:4022) are bound to loopback inside the Machine and have no Fly service, so they are unreachable from the internet. 
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

# SQLite lives on a volume so history survives deploys and restarts. Create it first:  fly volumes create proofline_data --size 1 --region iad One Machine only: a SQLite file must not be shared between Machines.
[[mounts]]
  source = "proofline_data"
  destination = "/data"

[env]
  PORT = "8080"
  DATABASE_URL = "/data/proofline.db"
  ANALYSIS_HOST = "127.0.0.1"
  ANALYSIS_PORT = "8099"
  ANALYSIS_SERVICE_URL = "http://127.0.0.1:8099"
  AGENT_HOST = "127.0.0.1"
  AGENT_PORT = "4022"
  AGENT_SERVICE_URL = "http://127.0.0.1:4022"
  CORPUS_DIR = "/srv/backend/test_docs"
  X402_NETWORK = "hedera:testnet"
  FACILITATOR_URL = "https://api.testnet.blocky402.com"
  PRICE_PING = "0.01"
  PRICE_VERIFY = "0.02"
  MAX_UPLOAD_BYTES = "10485760"
  SERVICE_VERSION = "0.1.0"
  DEMO_RATE_LIMIT_PER_MINUTE = "12"
  DEMO_MAX_CONCURRENT = "2"
  DEMO_TIMEOUT_MS = "120000"

  GATEWAY_PUBLIC_URL = "https://proofline.fly.dev"

# Secrets are NOT in this file. Set them with `fly secrets set`:
#   HEDERA_PAY_TO_ACCOUNT_ID, AGENT_ACCOUNT_ID, AGENT_PRIVATE_KEY
# They arrive as environment variables and are never baked into the image.

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
