; Proofline single-Machine process supervision.
;
; Three processes, all on loopback inside one Fly Machine:
;   analysis  127.0.0.1:8099  FastAPI + forensic engine (never exposed)
;   agent     127.0.0.1:4022  reference agent, holds AGENT_PRIVATE_KEY
;   gateway   0.0.0.0:8080    the ONLY process Fly routes traffic to
;
; priority orders startup: analysis, then agent, then gateway, so the gateway never proxies to a socket that does not exist yet. supervisord does not wait for readiness, so the gateway may still race on a cold boot; it returns a controlled SERVICE_UNAVAILABLE rather than crashing, and Fly's health check keeps the Machine out of rotation until /health answers.
; autorestart=true on every program is the real reason for supervisord over the shell-backgrounding form (`agent & exec server`): that form leaves a dead agent dead, and the demo path silently 503s until someone notices.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:analysis]
command=/opt/venv/bin/python backend/app.py
directory=/srv
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=npx tsx src/reference-agent.ts
directory=/srv/x402-gate
priority=20
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
command=npx tsx src/server.ts
directory=/srv/x402-gate
priority=30
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
